name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify bundled Action matches source
        run: |
          npm run build:action
          if ! git diff --quiet -- action/dist/index.js; then
            echo '::error::The committed Action bundle is out of date. Run npm run build:action and commit action/dist/index.js.'
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check Storybook coverage
        run: npm run check-storybook-coverage

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run Security & Unit Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Core editor and Pro browser regressions
        run: npm run test:e2e:core

      - name: Build Cloudflare deployment
        run: npm run build:vinext

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-please.yml

name: Publish Blog Articles

on:
  push:
    branches: [main]
    paths:
      - 'blog/**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devpublisher-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore DevPublisher state
        uses: actions/cache/restore@v4
        with:
          path: .devpublisher
          key: devpublisher-${{ github.repository }}-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: |
            devpublisher-${{ github.repository }}-${{ github.workflow }}-

      - name: Publish blog articles
        uses: Igorcbraz/DevPublisher@main
        with:
          folder: blog
          platforms: devto,hashnode,medium,tabnews
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_TOKEN }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          TABNEWS_SESSION_ID: ${{ secrets.TABNEWS_SESSION_ID }}

      - name: Upload Medium exports
        uses: actions/upload-artifact@v4
        with:
          name: medium-export
          path: .devpublisher/medium-export/
          if-no-files-found: ignore

      - name: Save DevPublisher state
        if: ${{ always() && hashFiles('.devpublisher/state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .devpublisher
          key: devpublisher-${{ github.repository }}-${{ github.workflow }}-${{ github.run_id }}
